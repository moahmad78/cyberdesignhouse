<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="silverFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circular emblem -->
  <rect width="100" height="100" rx="22" fill="#0b111e"/>
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Left Blue Faceted Hexagonal Arc -->
  <path d="M 22 28 L 48 14 L 48 28 L 32 38 L 32 62 L 48 72 L 48 86 L 22 72 Z" fill="url(#blueFacet)" filter="url(#glow)"/>
  
  <!-- Facet creases -->
  <polygon points="22,28 32,38 32,62 22,72" fill="#1e3a5f" opacity="0.6"/>
  <polygon points="22,28 48,14 48,28 32,38" fill="#38bdf8" opacity="0.4"/>
  <polygon points="32,62 48,72 48,86 22,72" fill="#0c2d48" opacity="0.7"/>

  <!-- Right Silver Faceted Crystal Wing -->
  <polygon points="56,22 78,48 56,40" fill="url(#silverFacet)"/>
  <polygon points="78,48 56,76 56,58" fill="#94a3b8"/>
  <polygon points="56,40 78,48 56,58" fill="#ffffff" opacity="0.8"/>
  <line x1="56" y1="22" x2="78" y2="48" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="78" y1="48" x2="56" y2="76" stroke="#94a3b8" stroke-width="1"/>
</svg>
